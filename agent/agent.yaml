metadata:
  owner: ""
  label: ""
  source: ""
  folder: []
  subfolder: []

runtime_environment:
  languages: [
    "Python 3.10.11", 
    "Javascript", 
    "Typescript", 
    "HTML",
    "CSS"
  ]
  library: [
    "Dash 2.9.2", 
    "Dash Bootstrap Components 1.4.1", 
    "Dash Mantine Components 0.12.0", 
    "Dash Iconify 0.1.2",
    "Dash Ag Grid 32.3.1"
  ]

llm_orchestration:
  temperature: 0.15
  max_output_token: 8192

model: 
  preferred: ""
  fallback:
    - ""

context_persistence:
  strategy: "selective-summary"
  compress_after_turns: 5
  storage_path: ".agents/state.db"

guardrails:
  strict_mode: True
  sensitive_files:
    - ".env"

skills:
  - "python_ast_analyzer"      
  - "dash_component_validator" 
  - "css_theme_injector"
  - "artifact_renderer"        
