metadata:
  owner: "Dedet"
  label: "Well Core"
  source: "local"
  folder: ["appweb/apps/30_welldata_wcore", "appweb/assets/30_welldata_wcore"]
  subfolder: []

runtime_environment:
  languages: ["python 3.10.11", "javascript", "typescript", "css"]
  library: ["Dash 2.9.2", "Dash Bootstrap Components 1.4.1", "Dash Mantine Components 0.12.0", "Dash Iconify 0.1.2"]

llm_orchestration:
  temperature: 0.15
  max_output_token: 8192

model: 
  preferred: "Gemini 3.1 Pro (High)"
  fallback: 
    - "Claude Opus 4.6 (Thinking)"

context_persistence:
  compress_after_turns: 5

storage_path: ".agents/state.db"

guardrails:
  strict_mode: True
  sensitive_files:
    - "**/*" 
    - "!appweb/apps/30_welldata_wcore/**"
    - "!appweb/assets/30_welldata_wcore/**"