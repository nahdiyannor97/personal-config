metadata:
  owner: "Dedet"
  label: "Universal Agent Configuration"
  source: "github.com/nahdiyannor97/personal-config/agent"
  folder: ["."]
  subfolder: []

runtime_environment:
  languages: [
    "Python", 
    "Javascript", 
    "Typescript", 
    "HTML",
    "CSS",
    "SQL"
  ]
  library: []

llm_orchestration:
  temperature: 0.15
  max_output_token: 8192

model: 
  preferred: "" 
  fallback:
    - ""
    
context_persistence:
  strategy: "selective-summary"
  compress_after_turns: 5
  storage_path: ".agents/state.db"

guardrails:
  strict_mode: True
  sensitive_files:
    - ".env"
    - "**/*.key"
    - "**/*.pem"

skills:
  - "python_ast_analyzer"      
  - "fullstack_architecture_designer" 
  - "database_and_schema_validator"
  - "security_and_auth_analyzer"
  - "artifact_renderer"

commands:
  - name: "plan"
    execute: "generate_artifact --type=planning --scope=$TARGET"
  - name: "plan-all"
    execute: "generate_artifact --type=planning --scope=all"
  - name: "lint"
    execute: "validate_syntax --rules=.agents/*.md --scope=$TARGET"
  - name: "lint-all"
    execute: "validate_syntax --rules=.agents/*.md --scope=all"
