metadata:
  owner: "Dedet"
  label: "Universal Agent Configuration"
  source: "github.com/nahdiyannor97/personal-config"
  folder: [.]

runtime_environment:
  languages:
    - "Python"
    - "Javascript"
    - "Typescript"
    - "HTML"
    - "CSS"
    - "SQL"
    - "C#"
    - ".NET"
  library: []

llm_orchestration:
  temperature: 0.15
  max_output_token: 8192
  thinking_config:
    thinking_level: "high"

model:
  preferred: "Claude Opus 4.6 (Thinking)"
  fallback:
    - "Gemini 3.1 Pro"

context_persistence:
  strategy: "selective-summary"
  compress_after_turns: 5
  storage_path: ".agents/state.db"

guardrails:
  strict_mode: true
  sensitive_files:
    - ".env"
    - "**/*.key"
    - "**/*.pem"

skills:
  - "python_ast_analyzer"
  - "fullstack_architecture_designer"
  - "database_and_schema_validator"
  - "security_and_auth_analyzer"
  - "artifact_renderer"
  - "ui_motion_designer"
