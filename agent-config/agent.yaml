metadata:
  owner: "Dedet"
  label: "Universal Agent Configuration"
  source: "github.com/nahdiyannor97/personal-config"
  folder: ["~/.gemini/antigravity"]

runtime_environment:
  languages:
    - "Python"
    - "Javascript"
    - "Typescript"
    - "HTML"
    - "CSS"
    - "SQL"
    - "C#"
    - ".NET"
  library_discovery:
    auto_detect: true
    manifest_files:
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "Pipfile"
      - "package.json"
      - "*.csproj"
      - "*.sln"

llm_orchestration:
  temperature: 0.15
  max_output_token: 8192
  thinking_config:
    thinking_level: "high"

model:
  preferred: "Gemini 4 Argon"
  fallback:
    - "Gemini 4 Hydrogen"

context_persistence:
  strategy: "selective-summary"
  compress_after_turns: 5
  storage_path: "~/.gemini/antigravity/state.db"

guardrails:
  strict_mode: true
  sensitive_files:
    - ".env"
    - "**/*.key"
    - "**/*.pem"

skills:
  - "couchdb"
  - "dash-ui"
  - "fast-api"
  - "httpx"
  - "pandas"
  - "polars"
  - "ponytail"
  - "pydantic"
  - "requests"
  - "sql-model"
